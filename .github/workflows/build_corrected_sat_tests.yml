name: Build Corrected Digital SAT LaTeX Tests

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Restore builder and capture diagnostics
        run: |
          mkdir -p output work
          cp sat_build/sat_true_latex_builder_v2.py.gz.b64 output/builder_from_repo.b64
          wc -c sat_build/sat_true_latex_builder_v2.py.gz.b64 | tee output/builder_diagnostics.txt
          sha256sum sat_build/sat_true_latex_builder_v2.py.gz.b64 | tee -a output/builder_diagnostics.txt
          python - <<'PY' || true
          from pathlib import Path
          import base64, gzip, traceback
          diag=Path('output/builder_diagnostics.txt')
          try:
              src = Path('sat_build/sat_true_latex_builder_v2.py.gz.b64').read_text(encoding='utf-8')
              clean = ''.join(src.split())
              clean += '=' * (-len(clean) % 4)
              packed = base64.b64decode(clean)
              code = gzip.decompress(packed)
              Path('sat_true_latex_builder_v2.py').write_bytes(code)
              with diag.open('a',encoding='utf-8') as f:
                  f.write(f'base64_chars={len(clean)} gzip_bytes={len(packed)} python_bytes={len(code)}\n')
          except Exception:
              with diag.open('a',encoding='utf-8') as f:
                  traceback.print_exc(file=f)
          PY
          if [ -s sat_true_latex_builder_v2.py ]; then python -m py_compile sat_true_latex_builder_v2.py; fi

      - name: Install dependencies
        if: ${{ hashFiles('sat_true_latex_builder_v2.py') != '' }}
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4 lxml pillow cairosvg

      - name: Build corrected tests
        if: ${{ hashFiles('sat_true_latex_builder_v2.py') != '' }}
        run: |
          python sat_true_latex_builder_v2.py \
            --index sat_build/filtered_question_index.csv \
            --out output/Digital_SAT_Corrected_LaTeX_Tests \
            --cache work/full_records.json \
            --workers 32 2>&1 | tee output/build.log

      - name: Package verification data
        if: always()
        run: |
          mkdir -p output
          if [ -d output/Digital_SAT_Corrected_LaTeX_Tests ]; then
            cd output
            zip -r -9 Digital_SAT_Corrected_LaTeX_Tests.zip Digital_SAT_Corrected_LaTeX_Tests
            cd ..
          fi
          python - <<'PY'
          from pathlib import Path
          root=Path('output/Digital_SAT_Corrected_LaTeX_Tests')
          report=[]
          if root.exists():
              texs=sorted(root.glob('Test_*/*.tex'))
              report.append(f'tests={len(texs)}')
              for p in texs:
                  s=p.read_text(encoding='utf-8')
                  report.append(f'{p.parent.name}: questions={s.count(chr(92)+"begin{question}")}, medium={s.count(chr(92)+"difficulty{medium}")}, hard={s.count(chr(92)+"difficulty{hard}")}')
          else:
              report.append('tests=0')
          Path('output/independent_audit.txt').write_text('\n'.join(report)+'\n',encoding='utf-8')
          PY

      - name: Upload corrected tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: corrected-digital-sat-latex-tests
          path: |
            output
            work/full_records.json
          if-no-files-found: warn
          retention-days: 7
