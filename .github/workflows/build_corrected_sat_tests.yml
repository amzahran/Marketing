name: Build Corrected Digital SAT LaTeX Tests

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Restore verified builder
        run: |
          mkdir -p output work
          python - <<'PY'
          from pathlib import Path
          import base64, gzip, hashlib
          p=Path('sat_build/sat_true_latex_builder_v2.py.gz.b64')
          clean=''.join(p.read_text(encoding='utf-8').split())
          # Correct one corrupted base64 character in the repository copy.
          if hashlib.sha256(clean.encode()).hexdigest() != 'cf03d3e76fd3040af0b2335625e559cdd882ee40cf9e44b102fe5310b3619466':
              assert len(clean)==18044
              assert clean[11085]=='3'
              clean=clean[:11085]+'8'+clean[11086:]
          assert hashlib.sha256(clean.encode()).hexdigest() == 'cf03d3e76fd3040af0b2335625e559cdd882ee40cf9e44b102fe5310b3619466'
          packed=base64.b64decode(clean)
          code=gzip.decompress(packed)
          assert hashlib.sha256(code).hexdigest() == '28d017f98614fb52502a12fa4f5b6b847678a9c22fdb06dba7f043d8943c4c7e'
          Path('sat_true_latex_builder_v2.py').write_bytes(code)
          Path('output/builder_diagnostics.txt').write_text(
              f'base64_chars={len(clean)}\ngzip_bytes={len(packed)}\npython_bytes={len(code)}\npython_sha256={hashlib.sha256(code).hexdigest()}\n',
              encoding='utf-8')
          PY
          python -m py_compile sat_true_latex_builder_v2.py

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4 lxml pillow cairosvg

      - name: Build corrected tests
        run: |
          python sat_true_latex_builder_v2.py \
            --index sat_build/filtered_question_index.csv \
            --out output/Digital_SAT_Corrected_LaTeX_Tests \
            --cache work/full_records.json \
            --workers 32 2>&1 | tee output/build.log

      - name: Package verification data
        if: always()
        run: |
          mkdir -p output
          if [ -d output/Digital_SAT_Corrected_LaTeX_Tests ]; then
            cd output
            zip -r -9 Digital_SAT_Corrected_LaTeX_Tests.zip Digital_SAT_Corrected_LaTeX_Tests
            cd ..
          fi
          python - <<'PY'
          from pathlib import Path
          root=Path('output/Digital_SAT_Corrected_LaTeX_Tests')
          report=[]
          if root.exists():
              texs=sorted(root.glob('Test_*/*.tex'))
              report.append(f'tests={len(texs)}')
              for p in texs:
                  s=p.read_text(encoding='utf-8')
                  report.append(f'{p.parent.name}: questions={s.count(chr(92)+"begin{question}")}, medium={s.count(chr(92)+"difficulty{medium}")}, hard={s.count(chr(92)+"difficulty{hard}")}')
          else:
              report.append('tests=0')
          Path('output/independent_audit.txt').write_text('\n'.join(report)+'\n',encoding='utf-8')
          PY

      - name: Upload corrected tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: corrected-digital-sat-latex-tests
          path: |
            output
            work/full_records.json
          if-no-files-found: warn
          retention-days: 7
