name: Build SAT LaTeX tests

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Probe College Board question bank frontend
        run: |
          set -eux
          mkdir -p probes/assets
          base=https://satsuiteeducatorquestionbank.collegeboard.org
          curl -L --silent --show-error "$base/" -o probes/index.html
          python - <<'PY'
          import re, pathlib, urllib.request
          root=pathlib.Path('probes')
          text=(root/'index.html').read_text(errors='ignore')
          urls=[]
          for u in re.findall(r'(?:src|href)=["\']([^"\']+\.(?:js|json)(?:\?[^"\']*)?)["\']',text):
              if u.startswith('http'): full=u
              else: full='https://satsuiteeducatorquestionbank.collegeboard.org/'+u.lstrip('/')
              urls.append(full)
          (root/'asset_urls.txt').write_text('\n'.join(urls))
          for i,u in enumerate(urls):
              try:
                  data=urllib.request.urlopen(u,timeout=60).read()
                  (root/'assets'/f'{i:02d}_'+u.rsplit('/',1)[-1].split('?')[0]).write_bytes(data)
              except Exception as e:
                  print('FAIL',u,e)
          PY
          grep -RhoE 'https?://[^"'"'"' )]+' probes/assets | sort -u > probes/http_urls.txt || true
          grep -RhoE '/[A-Za-z0-9_./-]*(api|question|search)[A-Za-z0-9_?&=./${}-]*' probes/assets | sort -u > probes/path_candidates.txt || true
          grep -RniE 'questionId|questionbank|graphql|baseURL|axios|fetch\(' probes/assets | head -500 > probes/interesting.txt || true
          wc -c probes/index.html probes/assets/* > probes/sizes.txt || true
      - name: Upload probes
        uses: actions/upload-artifact@v4
        with:
          name: collegeboard-eqb-probe
          path: probes
          if-no-files-found: error
          retention-days: 7
