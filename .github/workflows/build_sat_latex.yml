name: Build SAT LaTeX tests

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Download College Board frontend bundle
        run: |
          set -eux
          mkdir -p probes
          base=https://satsuiteeducatorquestionbank.collegeboard.org
          ua='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/150 Safari/537.36'
          curl -A "$ua" -L --silent --show-error "$base/" -o probes/index.html
          js=$(grep -oE '/assets/index-[A-Za-z0-9_-]+\.js' probes/index.html | head -1)
          echo "$js" > probes/js_path.txt
          curl -A "$ua" -L --silent --show-error -D probes/js.headers "$base$js" -o probes/index.js
          grep -Eo 'https?://[^"'"'"' )]+' probes/index.js | sort -u > probes/http_urls.txt || true
          grep -Eo '/[A-Za-z0-9_./-]*(api|question|search|export)[A-Za-z0-9_?&=./${}:-]*' probes/index.js | sort -u > probes/path_candidates.txt || true
          grep -oE '.{0,180}(questionId|questionbank|graphql|baseURL|axios|fetch\().{0,300}' probes/index.js | head -1000 > probes/interesting.txt || true
          wc -c probes/* > probes/sizes.txt
      - name: Upload probes
        uses: actions/upload-artifact@v4
        with:
          name: collegeboard-eqb-bundle
          path: probes
          if-no-files-found: error
          retention-days: 7
