name: Probe College Board Records

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Probe one digital and one legacy record
        run: |
          mkdir -p probe
          python - <<'PY'
          import json, requests
          h={'Accept':'application/json','Content-Type':'application/json','User-Agent':'Mozilla/5.0'}
          cases=[
            ('digital_single','https://qbank-api.collegeboard.org/msreportingquestionbank-prod/questionbank/digital/get-question',{'external_id':'ad6cdfd4-4643-45b2-b72d-0602fb30ce1c'}),
            ('digital_pdf','https://qbank-api.collegeboard.org/msreportingquestionbank-prod/questionbank/pdf-download',{'external_ids':['ad6cdfd4-4643-45b2-b72d-0602fb30ce1c']}),
          ]
          for name,url,payload in cases:
              try:
                  r=requests.post(url,headers=h,json=payload,timeout=60)
                  open(f'probe/{name}.status','w').write(f'{r.status_code}\n{r.headers}\n')
                  open(f'probe/{name}.raw','wb').write(r.content)
                  try: open(f'probe/{name}.pretty.json','w').write(json.dumps(r.json(),indent=2,ensure_ascii=False))
                  except Exception: pass
              except Exception as e: open(f'probe/{name}.error','w').write(repr(e))
          url='https://saic.collegeboard.org/disclosed/022222-DC.json'
          try:
              r=requests.get(url,headers={'Accept':'application/json','User-Agent':'Mozilla/5.0'},timeout=60)
              open('probe/legacy.status','w').write(f'{r.status_code}\n{r.headers}\n')
              open('probe/legacy.raw','wb').write(r.content)
              try: open('probe/legacy.pretty.json','w').write(json.dumps(r.json(),indent=2,ensure_ascii=False))
              except Exception: pass
          except Exception as e: open('probe/legacy.error','w').write(repr(e))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: qbank-record-probe
          path: probe
          if-no-files-found: error
          retention-days: 7
