name: Fetch College Board Question Data

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Fetch lookup
        run: |
          mkdir -p qbank
          curl --fail --connect-timeout 15 --max-time 120 \
            -H 'Accept: application/json' \
            'https://qbank-api.collegeboard.org/msreportingquestionbank-prod/questionbank/lookup' \
            -o qbank/lookup.json
          python -m json.tool qbank/lookup.json > qbank/lookup_pretty.json
      - name: Upload lookup
        uses: actions/upload-artifact@v4
        with:
          name: qbank-lookup
          path: qbank
          if-no-files-found: error
          retention-days: 7
