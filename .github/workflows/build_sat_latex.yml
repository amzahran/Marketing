name: Build SAT LaTeX tests

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Probe current question site
        run: |
          mkdir -p probes
          curl -L --silent --show-error -D probes/ac472881.headers https://satquestionbank.org/question/ac472881 -o probes/ac472881.html || true
          curl -L --silent --show-error -D probes/9b0a4eae.headers https://satquestionbank.org/question/9b0a4eae -o probes/9b0a4eae.html || true
          wc -c probes/* > probes/sizes.txt || true
          grep -Eo 'https?[^" ]+|/api/[^" ]+' probes/ac472881.html | head -200 > probes/links.txt || true
      - name: Upload probes
        uses: actions/upload-artifact@v4
        with:
          name: sat-latex-probe
          path: probes
          if-no-files-found: warn
          retention-days: 7
